name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$package_version'. Expected '$expected_tag'."
            exit 1
          fi

      - name: Publish package
        run: npm publish
